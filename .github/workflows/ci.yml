name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  cargo-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgtk-3-dev \
            libudev-dev \
            libxdo-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check

      - name: Cargo test
        run: cargo test --all-targets

      - name: Python toolchain
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python SDK tests
        env:
          PYTHONPATH: python/src
        run: python -m unittest discover -s python/tests -v

      - name: Python package compile check
        env:
          PYTHONPATH: python/src
        run: python -m compileall -q python/src/odon extensions/odon-cellpose/src/odon_cellpose

      - name: Build Python wheels
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist/python-client python
          python -m build --wheel --outdir dist/odon-cellpose extensions/odon-cellpose

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgtk-3-dev \
            libudev-dev \
            libxdo-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov --all-targets --workspace --lcov --output-path lcov.info
          cargo llvm-cov report

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: odon-coverage-lcov
          path: lcov.info
          if-no-files-found: error
